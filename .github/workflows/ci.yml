name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: localization-dashboard
    steps:
      - uses: actions/checkout@v4          # step 1: get your code
      - uses: actions/setup-node@v4        # step 2: get Node
        with:
          node-version: 22
      - run: npm ci                         # step 3: install packages
      - run: npx tsc --noEmit               # step 4: type check
      - run: npm test                       # step 5: tests